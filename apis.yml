aid: feesable
name: Feesable
description: >-
  Feesable is a fintech infrastructure company providing embedded finance and
  debt capital management (treasury) tooling that connects platforms, lenders,
  and capital markets. Its Embedded Finance product delivers white-labeled loan
  origination infrastructure — KYC/KYB verification, credit decisioning, dynamic
  pricing, fraud detection, and servicing/collections — exposed through APIs,
  SDKs, and embeddable widgets so SaaS platforms, marketplaces, and B2B lenders
  can launch embedded lending without building fintech from scratch. Its Debt
  Capital Management (DCM Engine) product provides institutional-grade treasury
  management — credit facility modeling, covenant monitoring, borrowing-base
  calculations, and automated lender/regulatory reporting connected to live
  portfolio data. Feesable targets GCC markets with Shariah-compliant options
  and is a portfolio company of 500 Global. The developer surface (APIs, SDKs,
  sandbox keys, documentation) is partner-gated behind a partnership onboarding
  process rather than publicly self-serve.
